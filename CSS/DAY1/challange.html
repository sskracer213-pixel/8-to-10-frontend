 <!DOCTYPE html>
<html>
<head>
    <title>Colored Boxes</title>

    <style>
        .box1{
            background-color: lightgreen;
            color: black;
            width: 400px;
            height: 120px;
            text-align: center;
        }

        .box2{
            background-color: lightpink;
            color: black;
            width: 400px;
            height: 120px;
            text-align: center;
        }

        .box3{
            background-color: lightyellow;
            color: darkblue;
            width: 400px;
            height: 120px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1 style="text-align:center;">Five Colored Boxes</h1>

    <!-- Inline CSS -->
    <div style="background-color:lightblue; color:black; width:400px; height:120px; text-align:center;">
        <h2>Box 1</h2>
        <p>This is the first colored box.</p>
    </div>

    <br>

    <!-- Inline CSS -->
    <div style="background-color:orange; color:white; width:400px; height:120px; text-align:center;">
        <h2>Box 2</h2>
        <p>This is the second colored box.</p>
    </div>

    <br>

    <!-- Internal CSS -->
    <div class="box1">
        <h2>Box 3</h2>
        <p>This is the third colored box.</p>
    </div>

    <br>

    <div class="box2">
        <h2>Box 4</h2>
        <p>This is the fourth colored box.</p>
    </div>

    <br>

    <div class="box3">
        <h2>Box 5</h2>
        <p>This is the fifth colored box.</p>
    </div>

</body>
</html>
