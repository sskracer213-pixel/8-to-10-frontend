 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Webpage</title>
    <link rel="stylesheet" href="assets/css/webpage.css">
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home">
        <h2>Home</h2>
        <p>This is the home section of the webpage.</p>
    </section>

    <section id="about">
        <h2>About</h2>
        <p>This webpage uses an external CSS file.</p>
    </section>

    <section id="services">
        <h2>Services</h2>
        <p>HTML and CSS Web Design.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: example@gmail.com</p>
    </section>

</body>
</html>
