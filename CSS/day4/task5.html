 <!DOCTYPE html>
<html>
<head>
    <title>Hide Cards</title>
    <link rel="stylesheet" href="assets/css/cards.css">
</head>
<body>

<div class="container">

<div class="card">
    <h2>Student Card</h2>
    <p>HTML & CSS</p>
</div>

<div class="card hide">

    <p>Software Developer</p>
</div>

    <p>Laptop</p>
</div>

</div>

</body>
</html>
