<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f8e9" />
      <stop offset="100%" stop-color="#dcedc8" />
    </linearGradient>
    <linearGradient id="deadHeartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffb74d" />
      <stop offset="100%" stop-color="#bcaaa4" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgGrad2)" />

  <!-- Soil & Base Water Level -->
  <path d="M0,400 Q300,380 600,400 L600,450 L0,450 Z" fill="#5d4037"/>
  <path d="M0,410 Q300,395 600,410 L600,450 L0,450 Z" fill="#3e2723" opacity="0.8"/>
  <rect x="0" y="420" width="600" height="30" fill="#81d4fa" opacity="0.4"/>

  <!-- Tiller Hill (Outer Healthy Green Leaves) -->
  <!-- Left Tillers -->
  <path d="M280,410 C240,300 150,200 80,140 C140,210 230,330 270,410 Z" fill="#43a047"/>
  <path d="M285,410 C260,280 200,160 140,80 C180,170 250,310 280,410 Z" fill="#66bb6a"/>
  
  <!-- Right Tillers -->
  <path d="M310,410 C340,290 420,180 520,120 C450,200 360,320 315,410 Z" fill="#388e3c"/>
  <path d="M305,410 C325,270 380,150 450,70 C400,160 340,300 305,410 Z" fill="#4caf50"/>

  <!-- Stem Base with Bore Hole Entry -->
  <rect x="282" y="360" width="30" height="50" rx="8" fill="#aed581"/>
  <!-- Larval Frass & Exit / Entry Hole -->
  <ellipse cx="295" cy="385" rx="5" ry="7" fill="#3e2723"/>
  <circle cx="298" cy="392" r="3" fill="#ffb300" opacity="0.8"/>
  <path d="M288,380 Q292,398 296,405" stroke="#795548" stroke-width="2" fill="none"/>

  <!-- Dead Heart: Central Shoot completely dried, straw-yellow & wilting -->
  <path d="M292,380 C294,260 290,140 275,50 C290,120 304,250 300,380 Z" fill="url(#deadHeartGrad)" stroke="#d7ccc8" stroke-width="1"/>
  <path d="M275,50 Q260,35 240,40 Q265,55 277,58" fill="#d7ccc8"/>
  <path d="M294,180 L280,120" stroke="#b0bec5" stroke-width="1.5" opacity="0.6"/>

  <!-- Pest Silhouette / Indicator (Yellow Stem Borer Moth) -->
  <g transform="translate(420, 160) scale(0.8)">
    <circle cx="0" cy="0" r="30" fill="#ffffff" opacity="0.85" stroke="#ff9800" stroke-width="2"/>
    <!-- Yellowish moth with black spot on forewing -->
    <path d="M-15,-5 L0,-18 L15,-5 L0,15 Z" fill="#ffe082" stroke="#ffb300" stroke-width="1.5"/>
    <circle cx="-5" cy="-2" r="2" fill="#212121"/>
    <circle cx="5" cy="-2" r="2" fill="#212121"/>
    <!-- Antennae -->
    <path d="M-2,-18 Q-10,-28 -15,-25 M2,-18 Q10,-28 15,-25" stroke="#795548" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Diagnosis Tag Overlay -->
  <rect x="20" y="20" width="280" height="42" rx="8" fill="#e65100" fill-opacity="0.9" />
  <text x="35" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🌾 Paddy: Stem Borer (Dead Heart)</text>
</svg>
