<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rustBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1" />
      <stop offset="100%" stop-color="#ffe0b2" />
    </linearGradient>
    <linearGradient id="rustLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ccc65" />
      <stop offset="70%" stop-color="#7cb342" />
      <stop offset="100%" stop-color="#558b2f" />
    </linearGradient>
    <radialGradient id="pustule" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6f00" />
      <stop offset="60%" stop-color="#e65100" />
      <stop offset="100%" stop-color="#bf360c" />
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#rustBg)" />

  <!-- Groundnut Stem -->
  <path d="M300,450 C310,340 300,250 290,180" stroke="#689f38" stroke-width="7" fill="none"/>

  <!-- Leaf Underside Showing Rust Pustules -->
  <g transform="translate(230, 150) rotate(-25)">
    <ellipse cx="0" cy="0" rx="80" ry="50" fill="url(#rustLeaf)"/>
    <path d="M-80,0 L80,0" stroke="#dcedc8" stroke-width="2"/>
    <!-- Orange Powdery Pustules -->
    <circle cx="-40" cy="-20" r="5" fill="url(#pustule)"/>
    <circle cx="-30" cy="-15" r="4.5" fill="url(#pustule)"/>
    <circle cx="-20" cy="-22" r="5.5" fill="url(#pustule)"/>
    <circle cx="-10" cy="-18" r="4" fill="url(#pustule)"/>
    <circle cx="0" cy="-25" r="6" fill="url(#pustule)"/>
    <circle cx="10" cy="-20" r="5" fill="url(#pustule)"/>
    <circle cx="25" cy="-22" r="4.5" fill="url(#pustule)"/>
    <circle cx="40" cy="-18" r="5" fill="url(#pustule)"/>

    <circle cx="-35" cy="15" r="5" fill="url(#pustule)"/>
    <circle cx="-20" cy="20" r="5.5" fill="url(#pustule)"/>
    <circle cx="-5" cy="18" r="6" fill="url(#pustule)"/>
    <circle cx="15" cy="22" r="5" fill="url(#pustule)"/>
    <circle cx="30" cy="16" r="4.5" fill="url(#pustule)"/>
    <circle cx="45" cy="20" r="5.5" fill="url(#pustule)"/>
  </g>

  <g transform="translate(370, 140) rotate(35)">
    <ellipse cx="0" cy="0" rx="85" ry="52" fill="url(#rustLeaf)"/>
    <path d="M-85,0 L85,0" stroke="#dcedc8" stroke-width="2"/>
    <!-- Rust Clusters -->
    <circle cx="-30" cy="-10" r="6" fill="url(#pustule)"/>
    <circle cx="-15" cy="-12" r="5" fill="url(#pustule)"/>
    <circle cx="5" cy="-15" r="6.5" fill="url(#pustule)"/>
    <circle cx="20" cy="-10" r="5.5" fill="url(#pustule)"/>
    <circle cx="40" cy="-12" r="5" fill="url(#pustule)"/>

    <circle cx="-25" cy="12" r="5" fill="url(#pustule)"/>
    <circle cx="-10" cy="18" r="6" fill="url(#pustule)"/>
    <circle cx="10" cy="15" r="5.5" fill="url(#pustule)"/>
    <circle cx="30" cy="20" r="6" fill="url(#pustule)"/>
  </g>

  <!-- Magnified Spore Cluster Callout -->
  <g transform="translate(480, 360)">
    <circle cx="0" cy="0" r="45" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
    <circle cx="-12" cy="-10" r="10" fill="url(#pustule)"/>
    <circle cx="10" cy="-12" r="12" fill="url(#pustule)"/>
    <circle cx="-2" cy="10" r="14" fill="url(#pustule)"/>
    <circle cx="18" cy="8" r="9" fill="url(#pustule)"/>
    <text x="0" y="58" font-family="Arial" font-size="11" font-weight="bold" fill="#bf360c" text-anchor="middle">Rust Pustules</text>
  </g>

  <!-- Diagnosis Tag Overlay -->
  <rect x="20" y="20" width="280" height="42" rx="8" fill="#d84315" fill-opacity="0.9" />
  <text x="35" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🥜 Groundnut: Rust Disease</text>
</svg>
