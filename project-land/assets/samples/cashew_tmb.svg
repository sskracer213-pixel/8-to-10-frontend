<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cashewBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="100%" stop-color="#e0f2f1" />
    </linearGradient>
    <linearGradient id="tenderShoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef5350" />
      <stop offset="50%" stop-color="#d4e157" />
      <stop offset="100%" stop-color="#388e3c" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#cashewBg)" />

  <!-- Cashew Branch -->
  <path d="M50,400 C150,380 250,320 340,240 C400,180 480,120 540,80" stroke="#795548" stroke-width="22" stroke-linecap="round" fill="none"/>
  
  <!-- Side Twigs -->
  <path d="M280,290 C320,240 350,200 400,160" stroke="#8d6e63" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Tender Pinkish-Green Flush Leaves -->
  <path d="M400,160 C440,110 500,90 560,110 C540,160 480,190 400,160 Z" fill="url(#tenderShoot)" opacity="0.95"/>
  <path d="M340,240 C380,180 440,170 480,210 C440,250 380,260 340,240 Z" fill="#66bb6a"/>
  <path d="M240,320 C180,280 140,220 160,160 C210,180 230,260 240,320 Z" fill="#43a047"/>

  <!-- Tea Mosquito Bug Lesions (Black elongated necrotic streaks & dried tips) -->
  <path d="M480,115 Q520,105 550,112" stroke="#212121" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="490" cy="130" r="7" fill="#212121" />
  <circle cx="515" cy="140" r="6" fill="#212121" />
  <circle cx="445" cy="165" r="8" fill="#212121" />
  <circle cx="420" cy="180" r="6" fill="#3e2723" />

  <!-- Tea Mosquito Bug (Helopeltis antonii) Insect with dorsal knob -->
  <g transform="translate(360, 130) rotate(-25)">
    <!-- Long Reddish Brown Legs -->
    <line x1="0" y1="0" x2="-25" y2="-20" stroke="#b71c1c" stroke-width="2"/>
    <line x1="0" y1="0" x2="25" y2="-20" stroke="#b71c1c" stroke-width="2"/>
    <line x1="0" y1="8" x2="-30" y2="10" stroke="#b71c1c" stroke-width="2"/>
    <line x1="0" y1="8" x2="30" y2="10" stroke="#b71c1c" stroke-width="2"/>
    <line x1="0" y1="16" x2="-25" y2="35" stroke="#b71c1c" stroke-width="2"/>
    <line x1="0" y1="16" x2="25" y2="35" stroke="#b71c1c" stroke-width="2"/>
    <!-- Slender Red/Black Body -->
    <ellipse cx="0" cy="10" rx="6" ry="16" fill="#c62828"/>
    <!-- Head & Long Antennae -->
    <circle cx="0" cy="-8" r="5" fill="#212121"/>
    <line x1="-2" y1="-10" x2="-22" y2="-35" stroke="#212121" stroke-width="1.5"/>
    <line x1="2" y1="-10" x2="22" y2="-35" stroke="#212121" stroke-width="1.5"/>
    <!-- Pin-like dorsal spine -->
    <line x1="0" y1="4" x2="0" y2="-10" stroke="#ffeb3b" stroke-width="2.5"/>
    <circle cx="0" cy="-10" r="2" fill="#ffeb3b"/>
  </g>

  <!-- Diagnosis Tag Overlay -->
  <rect x="20" y="20" width="340" height="42" rx="8" fill="#c62828" fill-opacity="0.9" />
  <text x="35" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🌰 Cashew: Tea Mosquito Bug (TMB)</text>
</svg>
