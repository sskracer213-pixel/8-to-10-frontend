<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9" />
      <stop offset="100%" stop-color="#c8e6c9" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="50%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <radialGradient id="blastSpot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0e0e0" />
      <stop offset="40%" stop-color="#8d6e63" />
      <stop offset="85%" stop-color="#4e342e" />
      <stop offset="100%" stop-color="#ffb74d" stop-opacity="0.8" />
    </radialGradient>
    <radialGradient id="blastSpot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfd8dc" />
      <stop offset="45%" stop-color="#6d4c41" />
      <stop offset="80%" stop-color="#3e2723" />
      <stop offset="100%" stop-color="#ffa726" stop-opacity="0.7" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#bgGrad)" />

  <!-- Field background silhouettes -->
  <path d="M0,450 Q150,380 300,410 T600,390 L600,450 Z" fill="#a5d6a7" opacity="0.6"/>
  <path d="M0,450 Q200,410 400,430 T600,420 L600,450 Z" fill="#81c784" opacity="0.5"/>

  <!-- Background Rice Leaves -->
  <path d="M120,450 C140,280 200,120 320,40 C310,130 260,300 230,450 Z" fill="#66bb6a" opacity="0.7"/>
  <path d="M450,450 C410,290 350,150 220,50 C240,160 330,320 390,450 Z" fill="#43a047" opacity="0.6"/>

  <!-- Main Rice Blade (Foreground) -->
  <g filter="url(#shadow)">
    <!-- Main Leaf Body -->
    <path d="M220,450 C230,320 270,180 370,30 C360,160 320,330 290,450 Z" fill="url(#leafGrad1)" />
    <!-- Leaf Central Midrib -->
    <path d="M255,450 C262,320 295,180 370,30" stroke="#a5d6a7" stroke-width="3" fill="none" opacity="0.8"/>
    <!-- Leaf veins -->
    <path d="M245,390 L268,380 M248,340 L273,330 M254,290 L281,280 M262,240 L292,230 M272,190 L308,180 M288,140 L328,130" stroke="#388e3c" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Characteristic Spindle/Eye-shaped Blast Lesions (Magnaporthe oryzae) -->
  <!-- Lesion 1 (Upper Leaf) -->
  <g transform="translate(325, 110) rotate(-45)">
    <ellipse cx="0" cy="0" rx="36" ry="14" fill="url(#blastSpot1)" />
    <path d="M-36,0 Q0,-6 36,0 Q0,6 -36,0 Z" fill="#4e342e" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="16" ry="6" fill="#eceff1" />
  </g>

  <!-- Lesion 2 (Middle Leaf - Severe) -->
  <g transform="translate(285, 210) rotate(-40)">
    <ellipse cx="0" cy="0" rx="46" ry="18" fill="url(#blastSpot1)" />
    <path d="M-46,0 Q0,-8 46,0 Q0,8 -46,0 Z" fill="#3e2723" opacity="0.9"/>
    <ellipse cx="-4" cy="0" rx="22" ry="8" fill="#cfd8dc" />
    <circle cx="10" cy="-2" r="3" fill="#3e2723"/>
  </g>

  <!-- Lesion 3 (Lower Leaf) -->
  <g transform="translate(265, 300) rotate(-35)">
    <ellipse cx="0" cy="0" rx="28" ry="12" fill="url(#blastSpot2)" />
    <ellipse cx="0" cy="0" rx="12" ry="5" fill="#eceff1" />
  </g>

  <!-- Emerging Pinhead Spots -->
  <ellipse cx="305" cy="165" rx="8" ry="4" fill="#8d6e63" transform="rotate(-40 305 165)"/>
  <ellipse cx="250" cy="360" rx="10" ry="5" fill="#8d6e63" transform="rotate(-30 250 360)"/>

  <!-- Diagnosis Tag Overlay -->
  <rect x="20" y="20" width="230" height="42" rx="8" fill="#b71c1c" fill-opacity="0.9" />
  <text x="35" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🌾 Paddy: Leaf Blast Spot</text>
</svg>
