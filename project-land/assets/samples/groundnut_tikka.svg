<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gnBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="100%" stop-color="#f1f8e9" />
    </linearGradient>
    <linearGradient id="gnLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="60%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <!-- Tikka Spot Radial Gradient (Dark center with bright yellow halo) -->
    <radialGradient id="tikkaSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#212121" />
      <stop offset="50%" stop-color="#3e2723" />
      <stop offset="65%" stop-color="#5d4037" />
      <stop offset="78%" stop-color="#ffd600" />
      <stop offset="100%" stop-color="#ffea00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#gnBgGrad)" />

  <!-- Groundnut Petiole / Stem -->
  <path d="M300,450 C300,350 290,260 280,200" stroke="#689f38" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Four Leaflets of Groundnut Pinnate Leaf -->
  <!-- Leaflet 1 (Top Left) -->
  <g transform="translate(220, 140) rotate(-35)">
    <ellipse cx="0" cy="0" rx="75" ry="45" fill="url(#gnLeafGrad)"/>
    <path d="M-75,0 L75,0" stroke="#aed581" stroke-width="2"/>
    <!-- Tikka Spots on Leaflet 1 -->
    <circle cx="-30" cy="-10" r="16" fill="url(#tikkaSpot)"/>
    <circle cx="15" cy="15" r="20" fill="url(#tikkaSpot)"/>
    <circle cx="40" cy="-15" r="12" fill="url(#tikkaSpot)"/>
  </g>

  <!-- Leaflet 2 (Top Right) -->
  <g transform="translate(360, 130) rotate(30)">
    <ellipse cx="0" cy="0" rx="80" ry="48" fill="url(#gnLeafGrad)"/>
    <path d="M-80,0 L80,0" stroke="#aed581" stroke-width="2"/>
    <!-- Tikka Spots on Leaflet 2 -->
    <circle cx="-20" cy="10" r="22" fill="url(#tikkaSpot)"/>
    <circle cx="25" cy="-8" r="18" fill="url(#tikkaSpot)"/>
    <circle cx="50" cy="12" r="14" fill="url(#tikkaSpot)"/>
    <circle cx="-50" cy="-12" r="10" fill="url(#tikkaSpot)"/>
  </g>

  <!-- Leaflet 3 (Bottom Left) -->
  <g transform="translate(190, 240) rotate(-60)">
    <ellipse cx="0" cy="0" rx="70" ry="42" fill="url(#gnLeafGrad)"/>
    <path d="M-70,0 L70,0" stroke="#aed581" stroke-width="2"/>
    <!-- Tikka Spots on Leaflet 3 (Severe necrotic coalescing spots) -->
    <circle cx="-10" cy="-5" r="24" fill="url(#tikkaSpot)"/>
    <circle cx="15" cy="8" r="16" fill="url(#tikkaSpot)"/>
  </g>

  <!-- Leaflet 4 (Bottom Right) -->
  <g transform="translate(380, 235) rotate(55)">
    <ellipse cx="0" cy="0" rx="72" ry="44" fill="url(#gnLeafGrad)"/>
    <path d="M-72,0 L72,0" stroke="#aed581" stroke-width="2"/>
    <!-- Tikka Spots on Leaflet 4 -->
    <circle cx="0" cy="0" r="20" fill="url(#tikkaSpot)"/>
    <circle cx="-35" cy="10" r="14" fill="url(#tikkaSpot)"/>
    <circle cx="35" cy="-10" r="16" fill="url(#tikkaSpot)"/>
  </g>

  <!-- Characteristic Yellow Halo Zoom Detail -->
  <g transform="translate(480, 360)">
    <circle cx="0" cy="0" r="45" fill="#ffffff" stroke="#fbc02d" stroke-width="3"/>
    <circle cx="0" cy="0" r="32" fill="url(#tikkaSpot)"/>
    <text x="0" y="58" font-family="Arial" font-size="11" font-weight="bold" fill="#3e2723" text-anchor="middle">Yellow Halo Spot</text>
  </g>

  <!-- Diagnosis Tag Overlay -->
  <rect x="20" y="20" width="310" height="42" rx="8" fill="#b71c1c" fill-opacity="0.9" />
  <text x="35" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🥜 Groundnut: Tikka Leaf Spot</text>
</svg>
