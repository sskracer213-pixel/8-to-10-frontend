<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cornBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="100%" stop-color="#e8f5e9" />
    </linearGradient>
    <linearGradient id="cornLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="50%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#cornBg)" />

  <!-- Corn Stem & Central Whorl -->
  <path d="M290,450 C290,280 285,150 280,60 L320,60 C315,150 310,280 310,450 Z" fill="#66bb6a"/>

  <!-- Broad Arching Corn Leaves -->
  <!-- Left Outer Leaf (With Windowing & Ragged Holes) -->
  <path d="M285,320 C220,280 120,240 40,220 C100,280 200,340 285,380 Z" fill="url(#cornLeaf)"/>
  <!-- Windowing shot holes on left leaf -->
  <ellipse cx="140" cy="260" rx="14" ry="7" fill="#fffde7" opacity="0.8"/>
  <ellipse cx="180" cy="290" rx="18" ry="9" fill="#3e2723" opacity="0.9"/>
  <ellipse cx="220" cy="315" rx="12" ry="6" fill="#3e2723" opacity="0.8"/>

  <!-- Right Outer Leaf -->
  <path d="M315,300 C380,260 480,220 560,200 C500,260 400,320 315,360 Z" fill="url(#cornLeaf)"/>
  <ellipse cx="440" cy="245" rx="16" ry="8" fill="#3e2723" opacity="0.9"/>
  <ellipse cx="380" cy="275" rx="14" ry="7" fill="#fffde7" opacity="0.8"/>

  <!-- Inner Central Whorl Funnel -->
  <path d="M280,180 C270,100 250,50 230,20 C270,60 290,120 295,190 Z" fill="#43a047"/>
  <path d="M320,180 C330,100 350,50 370,20 C330,60 310,120 305,190 Z" fill="#4caf50"/>

  <!-- Fall Armyworm Frass (Coarse Sawdust in Whorl) -->
  <g transform="translate(300, 160)">
    <ellipse cx="0" cy="0" rx="28" ry="18" fill="#5d4037"/>
    <circle cx="-10" cy="-4" r="4" fill="#8d6e63"/>
    <circle cx="8" cy="-6" r="5" fill="#795548"/>
    <circle cx="-2" cy="6" r="5" fill="#6d4c41"/>
    <circle cx="12" cy="4" r="3.5" fill="#a1887f"/>
    <!-- Striped Fall Armyworm Caterpillar Head -->
    <path d="M-8,-12 Q0,-22 8,-12 Q14,0 0,6 Q-14,0 -8,-12 Z" fill="#8d6e63" stroke="#ffb300" stroke-width="1.5"/>
    <path d="M-4,-18 L0,-10 L4,-18" stroke="#fff" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Diagnosis Tag Overlay -->
  <rect x="20" y="20" width="320" height="42" rx="8" fill="#c62828" fill-opacity="0.9" />
  <text x="35" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🌽 Corn: Fall Armyworm (FAW)</text>
</svg>
