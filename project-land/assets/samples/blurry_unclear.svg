<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="heavyBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32" />
    </filter>
  </defs>

  <rect width="600" height="450" fill="#cfd8dc" />

  <!-- Out of focus blobs and motion blurs -->
  <g filter="url(#heavyBlur)">
    <circle cx="150" cy="180" r="140" fill="#81c784" />
    <circle cx="420" cy="220" r="160" fill="#aed581" />
    <ellipse cx="280" cy="320" rx="180" ry="90" fill="#795548" />
    <ellipse cx="320" cy="120" rx="140" ry="100" fill="#ffe082" />
    <rect x="50" y="80" width="300" height="200" fill="#b0bec5" />
    <path d="M0,0 L600,450" stroke="#ffcc80" stroke-width="80" />
  </g>

  <!-- Overlay Unclear Warning Label -->
  <rect x="20" y="20" width="320" height="42" rx="8" fill="#c62828" fill-opacity="0.9" />
  <text x="35" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">⚠️ Blurry / Unclear Photo Sample</text>

  <g transform="translate(300, 225)">
    <circle cx="0" cy="0" r="45" fill="#ffffff" fill-opacity="0.85"/>
    <path d="M-20,-20 L20,20 M-20,20 L20,-20" stroke="#d32f2f" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
