<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa" />
      <stop offset="100%" stop-color="#e8f5e9" />
    </linearGradient>
    <linearGradient id="healthyLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66bb6a" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="goldenGrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="50%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#f57f17" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#skyGrad)" />

  <!-- Background lush crop rows -->
  <path d="M0,450 Q180,330 360,370 T600,340 L600,450 Z" fill="#81c784" opacity="0.4"/>
  <path d="M0,450 Q220,360 420,380 T600,360 L600,450 Z" fill="#4caf50" opacity="0.5"/>

  <!-- Robust Tillers & Leaves -->
  <path d="M220,450 C240,320 210,180 130,90 C190,170 250,290 260,450 Z" fill="url(#healthyLeaf)" />
  <path d="M360,450 C340,310 390,190 480,100 C410,180 360,280 340,450 Z" fill="url(#healthyLeaf)" />
  
  <!-- Central Flag Leaf -->
  <path d="M280,450 C290,260 300,140 330,40 C335,130 320,270 305,450 Z" fill="#43a047" />
  <path d="M292,450 C300,260 310,140 330,40" stroke="#a5d6a7" stroke-width="2" fill="none"/>

  <!-- Emerging Golden Panicle (Healthy Heavy Grains) -->
  <path d="M300,300 C320,200 370,120 440,70" stroke="#c0ca33" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Individual Plump Grains -->
  <g>
    <!-- Top grains -->
    <ellipse cx="435" cy="73" rx="10" ry="5" fill="url(#goldenGrain)" transform="rotate(30 435 73)"/>
    <ellipse cx="420" cy="85" rx="11" ry="5.5" fill="url(#goldenGrain)" transform="rotate(25 420 85)"/>
    <ellipse cx="405" cy="98" rx="12" ry="6" fill="url(#goldenGrain)" transform="rotate(35 405 98)"/>
    <ellipse cx="395" cy="115" rx="12" ry="6" fill="url(#goldenGrain)" transform="rotate(20 395 115)"/>
    
    <!-- Middle branch -->
    <ellipse cx="380" cy="130" rx="12" ry="6" fill="url(#goldenGrain)" transform="rotate(45 380 130)"/>
    <ellipse cx="365" cy="150" rx="13" ry="6.5" fill="url(#goldenGrain)" transform="rotate(30 365 150)"/>
    <ellipse cx="350" cy="170" rx="13" ry="6.5" fill="url(#goldenGrain)" transform="rotate(40 350 170)"/>
    <ellipse cx="335" cy="195" rx="13" ry="6.5" fill="url(#goldenGrain)" transform="rotate(25 335 195)"/>

    <!-- Lower branch -->
    <ellipse cx="325" cy="220" rx="13" ry="6.5" fill="url(#goldenGrain)" transform="rotate(35 325 220)"/>
    <ellipse cx="315" cy="245" rx="12" ry="6" fill="url(#goldenGrain)" transform="rotate(40 315 245)"/>
    <ellipse cx="308" cy="270" rx="11" ry="5.5" fill="url(#goldenGrain)" transform="rotate(30 308 270)"/>
  </g>

  <!-- Health Badge Overlay -->
  <rect x="20" y="20" width="280" height="42" rx="8" fill="#2e7d32" fill-opacity="0.9" />
  <text x="35" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🌾 Paddy: Healthy (Panicle Stage)</text>
</svg>
