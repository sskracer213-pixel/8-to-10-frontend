<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 Project - Live Weather & Forecast App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f43f5e;
            --primary-glow: rgba(244, 63, 94, 0.4);
            --bg-dark: #070d18;
            --card-bg: rgba(15, 23, 42, 0.85);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: #f1f5f9;
            min-height: 100vh;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .back-nav {
            position: fixed;
            top: 15px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(244, 63, 94, 0.4);
            color: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }
        .back-nav:hover {
            background: var(--primary);
            color: #070d18;
        }
        .weather-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 600px;
            margin: 0 auto;
        }
        .weather-icon {
            font-size: 80px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .forecast-pill {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <a href="../../index.html" class="back-nav">← Back to DevGalaxy</a>

    <div class="weather-card w-100 my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <span class="badge bg-danger rounded-pill px-3 py-2">DAY 04 PROJECT</span>
            <small class="text-secondary" id="currentTime">LIVE FORECAST</small>
        </div>

        <div class="input-group mb-4">
            <input type="text" id="cityInput" class="form-control bg-dark text-white border-secondary" placeholder="Enter city name (e.g. Chennai, Tokyo, London)...">
            <button onclick="searchWeather()" class="btn btn-danger px-4">Search 🔍</button>
        </div>

        <div id="weatherDisplay" class="text-center">
            <div class="weather-icon my-2">🌤️</div>
            <h2 class="orbitron text-white mt-2" id="cityName">Chennai, IN</h2>
            <div class="display-3 fw-bold orbitron text-white my-2" id="tempDisplay">31°C</div>
            <p class="text-info fs-5" id="weatherCondition">Partly Cloudy</p>

            <div class="row g-3 mt-4 text-start">
                <div class="col-4">
                    <div class="p-3 bg-dark bg-opacity-50 rounded-3 border border-secondary border-opacity-25">
                        <small class="text-secondary">Humidity</small>
                        <div class="fw-bold text-white fs-5" id="humidityVal">68%</div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-3 bg-dark bg-opacity-50 rounded-3 border border-secondary border-opacity-25">
                        <small class="text-secondary">Wind</small>
                        <div class="fw-bold text-white fs-5" id="windVal">14 km/h</div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-3 bg-dark bg-opacity-50 rounded-3 border border-secondary border-opacity-25">
                        <small class="text-secondary">UV Index</small>
                        <div class="fw-bold text-white fs-5">6 (High)</div>
                    </div>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-start">
                <h6 class="orbitron text-white mb-3">5-Day Outlook</h6>
                <div class="row g-2">
                    <div class="col"><div class="forecast-pill"><small class="text-secondary">Wed</small><div class="fs-4 my-1">☀️</div><strong class="text-white">33°</strong></div></div>
                    <div class="col"><div class="forecast-pill"><small class="text-secondary">Thu</small><div class="fs-4 my-1">🌤️</div><strong class="text-white">31°</strong></div></div>
                    <div class="col"><div class="forecast-pill"><small class="text-secondary">Fri</small><div class="fs-4 my-1">🌧️</div><strong class="text-white">29°</strong></div></div>
                    <div class="col"><div class="forecast-pill"><small class="text-secondary">Sat</small><div class="fs-4 my-1">⛈️</div><strong class="text-white">28°</strong></div></div>
                    <div class="col"><div class="forecast-pill"><small class="text-secondary">Sun</small><div class="fs-4 my-1">☀️</div><strong class="text-white">32°</strong></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cityData = {
            "chennai": { temp: 31, cond: "Partly Cloudy", icon: "🌤️", humidity: "68%", wind: "14 km/h" },
            "tokyo": { temp: 22, cond: "Sunny", icon: "☀️", humidity: "45%", wind: "8 km/h" },
            "london": { temp: 16, cond: "Rain Showers", icon: "🌧️", humidity: "82%", wind: "22 km/h" },
            "new york": { temp: 24, cond: "Clear Sky", icon: "☀️", humidity: "50%", wind: "11 km/h" }
        };

        function searchWeather() {
            const input = document.getElementById("cityInput").value.trim().toLowerCase();
            const cityName = document.getElementById("cityName");
            const tempDisplay = document.getElementById("tempDisplay");
            const condition = document.getElementById("weatherCondition");
            const humidity = document.getElementById("humidityVal");
            const wind = document.getElementById("windVal");
            const icon = document.querySelector(".weather-icon");

            if (cityData[input]) {
                const data = cityData[input];
                cityName.innerText = input.toUpperCase();
                tempDisplay.innerText = `${data.temp}°C`;
                condition.innerText = data.cond;
                humidity.innerText = data.humidity;
                wind.innerText = data.wind;
                icon.innerText = data.icon;
            } else {
                cityName.innerText = input.toUpperCase() || "Global City";
                const randomTemp = Math.floor(Math.random() * 15) + 20;
                tempDisplay.innerText = `${randomTemp}°C`;
                condition.innerText = "Mild & Breezy";
                humidity.innerText = "55%";
                wind.innerText = "12 km/h";
                icon.innerText = "🌤️";
            }
        }
    </script>
</body>
</html>
