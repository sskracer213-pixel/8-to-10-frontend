  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Bootstrap Navbar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-dark shadow">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand text-white fw-bold" href="#">
            MyWebsite
        </a>

        <!-- Mobile Button -->
        <button class="navbar-toggler bg-light"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link text-white px-3" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white px-3" href="#">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white px-3" href="#">Services</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white px-3" href="#">Contact</a>
                </li>

            </ul>

            <button class="btn btn-primary ms-3">
                Login
            </button>

        </div>

    </div>

</nav>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<section>
<div class="container mt-5">

    <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-indicators">
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
        </div>

        
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="https://picsum.photos/id/1015/1200/500"
                     class="d-block w-100"
                     alt="Image 1">
            </div>

            <div class="carousel-item">
                <img src="https://picsum.photos/id/1016/1200/500"
                     class="d-block w-100"
                     alt="Image 2">
            </div>

            <div class="carousel-item">
                <img src="https://picsum.photos/id/1018/1200/500"
                     class="d-block w-100"
                     alt="Image 3">
            </div>

        </div>

        
        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#myCarousel"
                data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>
        </button>

        
        <button class="carousel-control-next"
                type="button"
                data-bs-target="#myCarousel"
                data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</section>
<section><div class="container mt-5 card mx-auto text-center">

    <div class="card" style="width: 18rem;">
        
        <img src="../../CSS/day9/assets/css/image/s.jpeg" class="card-img-top" alt="Student">

        <div class="card-body ">
            <h5 class="card-title">Santhosh Kumar</h5>
            <p class="card-text">
                Web Developer skilled in HTML, CSS and Bootstrap.
            </p>
            <a href="#" class="btn btn-secondary">View Profile</a>
        </div>

    </div>

</div>
</section> 

<section>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card p-4">

                <h2 class="text-center mb-4">Registration Form</h2>

                <form>

                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" placeholder="Enter your password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="text" class="form-control" placeholder="Enter mobile number">
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">
                            Submit
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>
</section>
</body>
</html>
