 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Bootstrap Navbar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-dark shadow">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand text-white fw-bold" href="#">
            MyWebsite
        </a>

        <!-- Mobile Button -->
        <button class="navbar-toggler bg-light"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link text-white px-3" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white px-3" href="#">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white px-3" href="#">Services</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white px-3" href="#">Contact</a>
                </li>

            </ul>

            <button class="btn btn-primary ms-3">
                Login
            </button>

        </div>

    </div>

</nav>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
