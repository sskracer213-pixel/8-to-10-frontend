 <h1>Salary Filter</h1>

 <script>

let employees = [
    { name: "Santhosh", salary: 35000 },
    { name: "Kumar", salary: 45000 },
    { name: "Arun", salary: 50000 },
    { name: "Ravi", salary: 30000 }
];

for (let i = 0; i < employees.length; i++) {
    if (employees[i].salary > 40000) {
        console.log(employees[i].name);
        console.log(employees[i].salary);
    }
}








 </script>
