<head>

        .card {

            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: 0.5s;
        }

        .show {
            max-height: 150px;
            opacity: 1;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
