
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .dashboard {
            background-color: white;
            padding: 30px;
            width: 350px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .data {
            text-align: left;
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }

        .data p {
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <div class="dashboard">
        <h2>Dashboard</h2>

        <div class="data">
            <p>Name: <span id="name"></span></p>
            <p>Email: <span id="email"></span></p>
            <p>Password: <span id="password"></span></p>
        </div>
    </div>

    <script src="assets/task3.js"></script>

</body>
</html>
