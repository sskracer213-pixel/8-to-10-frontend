 <h1>Array &  Object Destructuring </h1>


 <script>

// Array Destructuring

const numbers = [10, 20, 30];

const [a, b, c] = numbers;

console.log("Array Values:");
console.log(a);
console.log(b);
console.log(c);


// Object Destructuring

const student = {
    name: "Ravi",
    age: 25,
    course: "JavaScript"
};

const { name, age, course } = student;

console.log("Student Details:");
console.log(name);
console.log(age);
console.log(course);




 </script>
