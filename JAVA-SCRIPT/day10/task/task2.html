 <h1>Implict & Explict</h1>



 <script>

//  Explicit Return

const add = (a,b) => {
    return a + b;
};

const square = (s) => {
    return s * s;
};

console.log(add(10,20));
console.log(square(5));

 
// implicit return

const add2 = (a,b) => a + b;

const  square2 = (s) => s * s;

console.log(add2(10,20));
console.log(square2(5));




 </script>
