 <h1> function template literal </h1>

 <script>

function studentDetails(name, course, city = "Chennai")

 { 
    return `My name is ${name} I am studying ${course} I am from ${city}`

  }


  console.log(studentDetails("Santhosh", "JavaScript")); 

  console.log(studentDetails("gopiga", "React"));




 </script>
