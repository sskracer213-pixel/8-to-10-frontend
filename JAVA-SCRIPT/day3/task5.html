 <body>
    

    <h1>INCREMENT & DECREMENT</h1>


    <script>

let count = 10;

count++;
console.log(" after count++",count);

count++;
console.log(" after count++",count);

count--;
console.log("after count--",count);

count--
console.log("after count-- ",count);




    </script>
